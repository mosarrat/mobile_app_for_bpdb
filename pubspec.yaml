name: bpdb_gis_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  awesome_snackbar_content: ^0.0.8
  fluttertoast: ^8.2.1
  intl: ^0.18.1
  get_storage: ^2.0.3
  carousel_slider: ^5.0.0
  fl_chart: ^0.66.0
  http: ^1.4.0
  connectivity_plus: ^6.1.4
  permission_handler: ^12.0.0+1
  webview_flutter: ^4.7.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  firebase_core: ^4.3.0
  firebase_database: ^12.1.1
  cloud_firestore: ^6.1.1
  flutter_map_marker_cluster: ^1.4.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/appicon.png"


flutter:
  uses-material-design: true
  assets:
    - assets/images/carousel/
    - assets/images/android-drawer.jpg
    - assets/images/android-drawer-bg.jpg
